<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1520" width="800" height="1520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9B8CC"/>
    </marker>
    <style>
      .txt{font-size:13.5px;fill:#374151}
      .muted{font-size:13px;fill:#6B7280}
      .label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#64748B}
      .chip{font-size:13px;fill:#374151;text-anchor:middle}
      .arrow{font-size:16px;fill:#94A3B8;text-anchor:middle}
      .card-s{fill:#F1F5F9;stroke:#A9B8CC;stroke-width:1.5}
      .card-r{fill:#FDF2F2;stroke:#F0B4B4;stroke-width:1.5}
      .card-g{fill:#EFF8F1;stroke:#A7D7B5;stroke-width:1.5}
      .chip-s{fill:#FFFFFF;stroke:#A9B8CC}
      .chip-r{fill:#FFFFFF;stroke:#F0B4B4}
      .chip-g{fill:#FFFFFF;stroke:#A7D7B5}
      .h-s{fill:#475569;font-weight:700}
      .h-r{fill:#C2474B;font-weight:700}
      .h-g{fill:#2E7D4F;font-weight:700}
      .num{font-size:15px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1520" fill="#FAFBFC"/>

  <!-- ===== HEADER ===== -->
  <text x="40" y="50" font-size="28" font-weight="700" fill="#1F2937">Business News Analysis (EMI)</text>
  <text x="40" y="77" class="muted" font-size="15">Academic Year 115 · Week 12 · Class Notes Summary</text>

  <!-- Legend -->
  <rect x="40" y="94" width="14" height="14" rx="3" class="card-s"/>
  <text x="62" y="106" class="muted" font-size="12">Core concepts</text>
  <rect x="180" y="94" width="14" height="14" rx="3" class="card-r"/>
  <text x="202" y="106" class="muted" font-size="12">Practice &amp; application</text>
  <rect x="370" y="94" width="14" height="14" rx="3" class="card-g"/>
  <text x="392" y="106" class="muted" font-size="12">Product planning</text>

  <!-- ===== TOP BANNERS ===== -->
  <rect x="40" y="125" width="355" height="95" rx="12" class="card-s"/>
  <text x="60" y="150" class="label">TERM PROJECT (TP)</text>
  <text x="60" y="178" class="txt"><tspan font-weight="700">BNA Agent</tspan> = a product (software / app)</text>
  <text x="60" y="202" class="txt">MVP → commercialized → transacted</text>

  <rect x="405" y="125" width="355" height="95" rx="12" class="card-s"/>
  <text x="425" y="150" class="label">GUIDING PRINCIPLE</text>
  <text x="425" y="178" class="txt"><tspan font-weight="700">○ Effective</tspan> — make something useful</text>
  <text x="425" y="202" class="txt">✗ Efficient — output ÷ input is not the focus</text>

  <!-- ===== PROCESS ===== -->
  <text x="40" y="250" class="label">THE PROCESS · FROM NOTES TO PRODUCT</text>

  <!-- Timeline connectors -->
  <g stroke="#A9B8CC" stroke-width="2" marker-end="url(#arr)">
    <line x1="70" y1="343" x2="70" y2="453"/>
    <line x1="70" y1="491" x2="70" y2="601"/>
    <line x1="70" y1="639" x2="70" y2="749"/>
    <line x1="70" y1="787" x2="70" y2="897"/>
    <line x1="70" y1="935" x2="70" y2="1045"/>
    <line x1="70" y1="1083" x2="70" y2="1193"/>
  </g>

  <!-- Feedback loop: Market → Analyze -->
  <path d="M760,1213 H778 V473 H762" fill="none" stroke="#A9B8CC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="791" y="843" font-size="11" fill="#64748B" text-anchor="middle" transform="rotate(90 791 843)">feedback · repeat the cycle</text>

  <!-- STEP 1: CAPTURE (red) -->
  <circle cx="70" cy="325" r="18" fill="#E58A8D"/><text x="70" y="330" class="num">1</text>
  <rect x="110" y="265" width="650" height="120" rx="12" class="card-r"/>
  <text x="130" y="293" font-size="16"><tspan class="h-r">CAPTURE</tspan><tspan class="muted" dx="10">In-class note-taking</tspan></text>
  <rect x="130" y="307" width="100" height="26" rx="13" class="chip-r"/><text x="180" y="325" class="chip">Handwritten</text>
  <rect x="240" y="307" width="125" height="26" rx="13" class="chip-r"/><text x="302.5" y="325" class="chip">Voice recording</text>
  <rect x="375" y="307" width="60" height="26" rx="13" class="chip-r"/><text x="405" y="325" class="chip">Video</text>
  <rect x="445" y="307" width="140" height="26" rx="13" class="chip-r"/><text x="515" y="325" class="chip">Images / pictures</text>
  <text x="130" y="355" class="txt">Collect the raw material from class in any format.</text>

  <!-- STEP 2: ANALYZE (slate) -->
  <circle cx="70" cy="473" r="18" fill="#8A9BB3"/><text x="70" y="478" class="num">2</text>
  <rect x="110" y="413" width="650" height="120" rx="12" class="card-s"/>
  <text x="130" y="441" font-size="16"><tspan class="h-s">ANALYZE</tspan><tspan class="muted" dx="10">Analytical thinking</tspan></text>
  <rect x="130" y="455" width="245" height="26" rx="13" class="chip-s"/><text x="252.5" y="473" class="chip">Separate into parts &amp; components</text>
  <text x="392" y="474" class="arrow">→</text>
  <rect x="410" y="455" width="95" height="26" rx="13" class="chip-s"/><text x="457.5" y="473" class="chip">Recombine</text>
  <text x="520" y="474" class="arrow">→</text>
  <rect x="535" y="455" width="200" height="26" rx="13" class="chip-s"/><text x="635" y="473" class="chip">Investigate with evidence</text>
  <text x="130" y="503" class="txt">Apply to: the problem · the demand · the question</text>
  <text x="130" y="523" class="muted">↻ Repeat the cycle (recombine ↔ problem) to find potential relationships</text>

  <!-- STEP 3: REPRESENT (slate) -->
  <circle cx="70" cy="621" r="18" fill="#8A9BB3"/><text x="70" y="626" class="num">3</text>
  <rect x="110" y="561" width="650" height="120" rx="12" class="card-s"/>
  <text x="130" y="589" font-size="16"><tspan class="h-s">REPRESENT</tspan><tspan class="muted" dx="10">A new representation</tspan></text>
  <rect x="130" y="603" width="135" height="26" rx="13" class="chip-s"/><text x="197.5" y="621" class="chip">Coggle mind map</text>
  <text x="280" y="622" class="arrow">→</text>
  <rect x="295" y="603" width="90" height="26" rx="13" class="chip-s"/><text x="340" y="621" class="chip">Systematic</text>
  <rect x="395" y="603" width="90" height="26" rx="13" class="chip-s"/><text x="440" y="621" class="chip">Structured</text>
  <rect x="495" y="603" width="130" height="26" rx="13" class="chip-s"/><text x="560" y="621" class="chip">Process-oriented</text>
  <text x="640" y="622" class="arrow">→</text>
  <rect x="655" y="603" width="80" height="26" rx="13" fill="#E2E8F0" stroke="#A9B8CC"/><text x="695" y="621" class="chip" font-weight="700">Insight</text>
  <text x="130" y="651" class="txt">Turn the analysis into a mind map → see the big picture → gain insight.</text>

  <!-- STEP 4: SUMMARIZE (red) -->
  <circle cx="70" cy="769" r="18" fill="#E58A8D"/><text x="70" y="774" class="num">4</text>
  <rect x="110" y="709" width="650" height="120" rx="12" class="card-r"/>
  <text x="130" y="737" font-size="16"><tspan class="h-r">SUMMARIZE</tspan><tspan class="muted" dx="10">From analysis to document</tspan></text>
  <rect x="130" y="751" width="85" height="26" rx="13" class="chip-r"/><text x="172.5" y="769" class="chip">Analysis</text>
  <text x="230" y="770" class="arrow">→</text>
  <rect x="245" y="751" width="85" height="26" rx="13" class="chip-r"/><text x="287.5" y="769" class="chip">Summary</text>
  <text x="345" y="770" class="arrow">→</text>
  <rect x="360" y="751" width="165" height="26" rx="13" class="chip-r"/><text x="442.5" y="769" class="chip">.md file (Markdown)</text>
  <text x="540" y="770" class="arrow">→</text>
  <rect x="555" y="751" width="95" height="26" rx="13" class="chip-r"/><text x="602.5" y="769" class="chip">Document</text>
  <text x="130" y="799" class="txt">Skills: creativity · critical thinking</text>

  <!-- STEP 5: PLAN (green) -->
  <circle cx="70" cy="917" r="18" fill="#7CC197"/><text x="70" y="922" class="num">5</text>
  <rect x="110" y="857" width="650" height="120" rx="12" class="card-g"/>
  <text x="130" y="885" font-size="16"><tspan class="h-g">PLAN</tspan><tspan class="muted" dx="10">Product Requirement Document</tspan></text>
  <rect x="130" y="899" width="80" height="26" rx="13" class="chip-g"/><text x="170" y="917" class="chip">Demand</text>
  <text x="222" y="918" class="arrow">+</text>
  <rect x="235" y="899" width="80" height="26" rx="13" class="chip-g"/><text x="275" y="917" class="chip">Supply</text>
  <text x="330" y="918" class="arrow">→</text>
  <rect x="345" y="899" width="85" height="26" rx="13" class="chip-g"/><text x="387.5" y="917" class="chip">Product</text>
  <text x="445" y="918" class="arrow">→</text>
  <rect x="460" y="899" width="65" height="26" rx="13" fill="#DDF0E3" stroke="#A7D7B5"/><text x="492.5" y="917" class="chip" font-weight="700">PRD</text>
  <text x="130" y="947" class="txt">Write what users need (demand) and what the product offers (supply) before building.</text>

  <!-- STEP 6: BUILD (red) -->
  <circle cx="70" cy="1065" r="18" fill="#E58A8D"/><text x="70" y="1070" class="num">6</text>
  <rect x="110" y="1005" width="650" height="120" rx="12" class="card-r"/>
  <text x="130" y="1033" font-size="16"><tspan class="h-r">BUILD</tspan><tspan class="muted" dx="10">Term project MVP with AI</tspan></text>
  <text x="130" y="1065" class="txt">AI members:</text>
  <rect x="215" y="1047" width="75" height="26" rx="13" class="chip-r"/><text x="252.5" y="1065" class="chip">Chatbot</text>
  <rect x="300" y="1047" width="90" height="26" rx="13" class="chip-r"/><text x="345" y="1065" class="chip">Task agent</text>
  <rect x="400" y="1047" width="70" height="26" rx="13" class="chip-r"/><text x="435" y="1065" class="chip">Coding</text>
  <text x="490" y="1066" class="arrow">→</text>
  <rect x="510" y="1047" width="190" height="26" rx="13" fill="#FBE3E3" stroke="#F0B4B4"/><text x="605" y="1065" class="chip" font-weight="700">Single-page app (.html)</text>
  <text x="130" y="1095" class="txt">MVP = Minimum Viable Product: the smallest version that works and is worth releasing</text>
  <text x="130" y="1115" class="muted">Designed for portrait (mobile) and landscape (PC) screens</text>

  <!-- STEP 7: MARKET (slate) -->
  <circle cx="70" cy="1213" r="18" fill="#8A9BB3"/><text x="70" y="1218" class="num">7</text>
  <rect x="110" y="1153" width="650" height="120" rx="12" class="card-s"/>
  <text x="130" y="1181" font-size="16"><tspan class="h-s">MARKET</tspan><tspan class="muted" dx="10">Commercialize &amp; transact</tspan></text>
  <rect x="130" y="1195" width="90" height="26" rx="13" class="chip-s"/><text x="175" y="1213" class="chip">Producers</text>
  <text x="235" y="1214" class="arrow">→</text>
  <rect x="250" y="1195" width="80" height="26" rx="13" fill="#E2E8F0" stroke="#A9B8CC"/><text x="290" y="1213" class="chip" font-weight="700">Market</text>
  <text x="345" y="1214" class="arrow">←</text>
  <rect x="360" y="1195" width="95" height="26" rx="13" class="chip-s"/><text x="407.5" y="1213" class="chip">Consumers</text>
  <text x="130" y="1243" class="txt">Value = WTP (Willingness To Pay) → TA (Target Audience)</text>
  <text x="130" y="1263" class="muted">↺ Market feedback returns to producers → improve and repeat</text>

  <!-- ===== SUPPORTING NOTES ===== -->
  <text x="40" y="1305" class="label">SUPPORTING NOTES</text>

  <!-- Team activity -->
  <rect x="40" y="1318" width="350" height="170" rx="12" class="card-r"/>
  <text x="60" y="1345" class="label" fill="#C2474B" style="fill:#C2474B">TEAM ACTIVITY</text>
  <text x="60" y="1373" class="txt" font-weight="700">#1 Team member session</text>
  <text x="60" y="1398" class="txt">AI tools can join the team as members:</text>
  <rect x="60" y="1410" width="75" height="26" rx="13" class="chip-r"/><text x="97.5" y="1428" class="chip">Chatbot</text>
  <rect x="145" y="1410" width="90" height="26" rx="13" class="chip-r"/><text x="190" y="1428" class="chip">Task agent</text>
  <rect x="245" y="1410" width="70" height="26" rx="13" class="chip-r"/><text x="280" y="1428" class="chip">Coding</text>
  <text x="60" y="1468" class="muted">Skills: creativity · critical thinking</text>

  <!-- Layout & style -->
  <rect x="410" y="1318" width="350" height="170" rx="12" class="card-r"/>
  <text x="430" y="1345" class="label" style="fill:#C2474B">LAYOUT &amp; STYLE</text>
  <rect x="432" y="1358" width="22" height="36" rx="4" fill="#FFFFFF" stroke="#E58A8D" stroke-width="1.5"/>
  <text x="468" y="1381" class="txt"><tspan font-weight="700">Portrait</tspan> — mobile phones</text>
  <rect x="427" y="1408" width="32" height="22" rx="3" fill="#FFFFFF" stroke="#E58A8D" stroke-width="1.5"/>
  <text x="468" y="1424" class="txt"><tspan font-weight="700">Landscape</tspan> — notebook / PC / TV display</text>
  <text x="430" y="1468" class="txt">Style: <tspan font-weight="700">simple · clear · light</tspan></text>

  <!-- Footer -->
  <text x="400" y="1510" font-size="11" fill="#9CA3AF" text-anchor="middle">Source: handwritten class notes · AY115 Week 12</text>
</svg>
